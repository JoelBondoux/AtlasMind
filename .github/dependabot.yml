version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # Keep dependency PRs on the integration branch, not the default (main).
    target-branch: "develop"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
      - area:ci
    groups:
      runtime-integrations:
        patterns:
          - "@modelcontextprotocol/sdk"
          - "zod"
          - "@types/vscode"
      developer-tooling:
        dependency-type: development
    ignore:
      # TypeScript is held at 6.x because typescript-eslint pins it.
      #
      # `@typescript-eslint/parser` declares `typescript: ">=4.8.4 <6.1.0"`, so a
      # 7.x bump does not merely warn — it breaks `npm run lint` on every
      # platform, which is what happened to PR #176 (failed CI on all three
      # runners in under 25 seconds). Without this rule Dependabot re-proposes
      # the same bump daily, bundled into the developer-tooling group, which
      # blocks the five harmless updates travelling with it.
      #
      # Remove this entry once typescript-eslint widens its peer range to admit
      # TypeScript 7 — check `npm info @typescript-eslint/parser peerDependencies`
      # rather than assuming a release has done it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "security"
      include: scope
    # Enable security updates
    reviewers:
      - "JoelBondoux"

  - package-ecosystem: github-actions
    directory: "/"
    # Keep dependency PRs on the integration branch, not the default (main).
    target-branch: "develop"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
      - area:ci
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "security"
      include: scope