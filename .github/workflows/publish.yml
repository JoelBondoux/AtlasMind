name: Release — publish Marketplace from tag (manual, gated)

# Not triggered by a tag push any more (2026-11-23). Releases reach the
# Marketplace through the release gate, normally from the scheduled publish
# windows on the maintainer's machine (scripts/release-gate/, docs/releasing.md),
# at most twice a UK day. This workflow is the hosted fallback for one tag, and
# it runs the same gate: nothing here can publish without it passing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: write
  # Required for the runner to mint an OIDC token for the managed identity's
  # federated credential. Publishing authenticates through Microsoft Entra ID;
  # there is no Marketplace secret in this repository.
  id-token: write

jobs:
  publish:
    name: Publish Marketplace release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Load-bearing, twice over.
    #
    # The managed identity's federated credential is scoped to the subject
    # `repo:JoelBondoux/AtlasMind:environment:marketplace`, so the OIDC token only
    # matches while the job runs in this environment. Without this line the subject
    # is the tag ref instead and Entra refuses the exchange.
    #
    # It is also the natural place to require a reviewer, should this ever want an
    # approval gate: publishing cannot be undone, and a published version can never
    # be replaced.
    environment: marketplace

    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=refs/tags/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        env:
          TAG_NAME: ${{ steps.ref.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"
          if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match package version ${VERSION}."
            exit 1
          fi

      - name: Sign in to Azure with workload identity federation
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          # Variables, not secrets: a client id, tenant id and subscription id are
          # all discoverable. What stops anyone else assuming this identity is the
          # federated credential's subject, which names this repository and the
          # environment above.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install the VS Code CLI for the gate's install check
        # The gate installs the packaged VSIX into a throwaway VS Code profile
        # (`code --install-extension`), CLI only. Without it the gate fails closed.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vscode.tar.gz" "https://update.code.visualstudio.com/latest/linux-x64/stable"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP"
          echo "ATLASMIND_GATE_CODE_CLI=$RUNNER_TEMP/VSCode-linux-x64/bin/code" >> "$GITHUB_ENV"

      - name: Run the release gate and publish only if it passes
        # Full local CI, the security suite, npm audit (high+), a secret scan of
        # the VSIX, an install and an activation smoke test, the daily limit and
        # `vsce verify-pat`, then a publish of the exact VSIX
        # that passed. Fails closed; there is no bypass option.
        run: node scripts/release-gate/release-gate.mjs --publish --azure-credential

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ steps.ref.outputs.tag }}
        run: |
          gh release view "${TAG_NAME}" >/dev/null 2>&1 && exit 0
          gh release create "${TAG_NAME}" --generate-notes --title "${TAG_NAME}"
