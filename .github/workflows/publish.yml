name: Release — publish Marketplace from tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: write
  # Required for the runner to mint an OIDC token for the managed identity's
  # federated credential. Publishing authenticates through Microsoft Entra ID;
  # there is no Marketplace secret in this repository.
  id-token: write

jobs:
  publish:
    name: Publish Marketplace release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Load-bearing, twice over.
    #
    # The managed identity's federated credential is scoped to the subject
    # `repo:JoelBondoux/AtlasMind:environment:marketplace`, so the OIDC token only
    # matches while the job runs in this environment. Without this line the subject
    # is the tag ref instead and Entra refuses the exchange.
    #
    # It is also the natural place to require a reviewer, should this ever want an
    # approval gate: publishing cannot be undone, and a published version can never
    # be replaced.
    environment: marketplace

    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=refs/tags/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        env:
          TAG_NAME: ${{ steps.ref.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"
          if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match package version ${VERSION}."
            exit 1
          fi

      - name: Sign in to Azure with workload identity federation
        uses: azure/login@v3
        with:
          # Variables, not secrets: a client id, tenant id and subscription id are
          # all discoverable. What stops anyone else assuming this identity is the
          # federated credential's subject, which names this repository and the
          # environment above.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check publish rights before attempting to publish
        # The guard that was missing. A dead credential used to surface as a failure
        # *during* the publish — the run that produced `TF400813 … not authorized`
        # for 0.208.0 had already packaged the extension before finding out. This
        # asks the question first, costs a second, and consumes no version number.
        #
        # `vsce verify-pat` is named for the PAT era; with `--azure-credential` it
        # verifies the Entra identity instead.
        run: npx @vscode/vsce verify-pat JoelBondoux --azure-credential

      - name: Publish to Visual Studio Marketplace
        # Not `publish:release`. That script is the local emergency path and uses
        # whatever credential `vsce login` stored in the OS keychain; adding
        # `--azure-credential` to it would break publishing from a developer
        # machine. Two paths, two scripts, neither pretending to be the other.
        run: npm run publish:release:ci

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ steps.ref.outputs.tag }}
        run: |
          gh release view "${TAG_NAME}" >/dev/null 2>&1 && exit 0
          gh release create "${TAG_NAME}" --generate-notes --title "${TAG_NAME}"
