name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Lets a feature branch be built on demand without opening a pull request.
  workflow_dispatch:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Audit third-party integration coverage
        run: npm run monitor:integrations:audit

      - name: Unit tests
        run: npm run test

      - name: Local recommendation registry tests
        run: npm run test:providers:local-recommendations

      # Uploaded even when the suite failed — a red run is exactly when somebody
      # needs the per-test breakdown, and `if: always()` is what makes the
      # artifact survive the step that produced it.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      # An installable build of the exact commit CI just verified. F5 debugging
      # needs none of this — it builds from source — but a VSIX is the only way
      # to try a branch in your real editor rather than an Extension Development
      # Host, and downloading one from a green run beats being sent a file.
      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npm run package

      - name: Upload VSIX artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: atlasmind-vsix-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
