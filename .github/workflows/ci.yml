name: CI

on:
  pull_request:
    # The hosted matrix is release evidence. Routine work lands on develop and
    # is checked locally or by the separately gated trusted-runner workflow.
    branches: [main]
  # Explicit escape hatch for platform-specific diagnosis. Manual means hosted
  # capacity is spent deliberately rather than on every development push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs once rather than across the OS matrix: a secret in the history is a
  # secret on every platform, and three identical scans would treble the cost
  # of the job most likely to be the reason somebody rotates a key today.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: a credential that was committed and then removed is
          # still a credential that leaked, and a shallow clone cannot see it.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        # v3. The v2 line runs on the Node 20 Actions runtime, which GitHub
        # removes from hosted runners on 16 September 2026; v3 is the same
        # action on Node 24 with no input, output or behaviour change.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Audit third-party integration coverage
        run: npm run monitor:integrations:audit

      - name: Unit tests
        run: npm run test

      - name: Local recommendation registry tests
        run: npm run test:providers:local-recommendations

      # Uploaded even when the suite failed — a red run is exactly when somebody
      # needs the per-test breakdown, and `if: always()` is what makes the
      # artifact survive the step that produced it.
      - name: Upload test report
        if: always()
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-report-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      # An installable build of the exact commit CI just verified. F5 debugging
      # needs none of this — it builds from source — but a VSIX is the only way
      # to try a branch in your real editor rather than an Extension Development
      # Host, and downloading one from a green run beats being sent a file.
      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npm run package

      - name: Upload VSIX artifact
        if: matrix.os == 'ubuntu-latest'
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlasmind-vsix-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
