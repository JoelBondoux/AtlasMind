name: One-shot apply and validate reviewed-PR local CI feature

on:
  push:
    branches:
      - feat/provider-neutral-reviewed-pr-local-ci
    paths:
      - .github/reviewed-pr-local-ci.ready

permissions: {}

jobs:
  validate:
    name: Validate source, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out feature branch
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Decode, apply and repair the proposed feature without committing it
        shell: bash
        run: |
          cat .github/reviewed-pr-local-ci.patch.gz.b64.part-* | base64 --decode | gzip --decompress > "$RUNNER_TEMP/reviewed-pr-local-ci.patch"
          base64 --decode .github/reviewed-pr-local-ci-fix.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/reviewed-pr-local-ci-fix.patch"
          git apply --check "$RUNNER_TEMP/reviewed-pr-local-ci.patch"
          git apply "$RUNNER_TEMP/reviewed-pr-local-ci.patch"
          git apply --check "$RUNNER_TEMP/reviewed-pr-local-ci-fix.patch"
          git apply "$RUNNER_TEMP/reviewed-pr-local-ci-fix.patch"
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('docs/local-ci-and-safe-runners.md',
               '- `.github/workflows/atlasmind-reviewed-pr-local-ci.yml` -- an owner-only manual workflow whose inputs',
               '- **.github/workflows/atlasmind-reviewed-pr-local-ci.yml** -- an owner-only manual workflow whose inputs'),
              ('src/views/chatSlashRouting.ts',
               'so every one of the twenty\n * deterministic slash commands',
               'so every one of the twenty-seven\n * recognised slash commands'),
              ('src/views/chatSlashRouting.ts',
               'is twenty-two chances for the panel to',
               'is twenty-five chances for the panel to'),
              ('tests/chat/slashCommandRouting.test.ts',
               "    24: 'twenty-four', 25: 'twenty-five',\n",
               "    24: 'twenty-four', 25: 'twenty-five', 26: 'twenty-six', 27: 'twenty-seven',\n"),
              ('src/core/localCiRepositoryPatch.ts',
               'export function isAtlasMindManagedLocalCiContent(',
               'function isAtlasMindManagedLocalCiContent('),
              ('src/core/reviewedPrLocalCi.ts',
               'export function reviewedPrFingerprint(',
               'function reviewedPrFingerprint('),
          ]
          for filename, old, new in replacements:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected one repair target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          node --check media/projectDashboard.js

      - name: Set up Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete AtlasMind local CI gate
        run: npm run ci:local

  commit:
    name: Commit the already-validated feature
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out feature branch for the write-only commit
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Apply the validated patch, repairs and remove one-shot helpers
        shell: bash
        run: |
          cat .github/reviewed-pr-local-ci.patch.gz.b64.part-* | base64 --decode | gzip --decompress > "$RUNNER_TEMP/reviewed-pr-local-ci.patch"
          base64 --decode .github/reviewed-pr-local-ci-fix.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/reviewed-pr-local-ci-fix.patch"
          git apply --check "$RUNNER_TEMP/reviewed-pr-local-ci.patch"
          git apply "$RUNNER_TEMP/reviewed-pr-local-ci.patch"
          git apply --check "$RUNNER_TEMP/reviewed-pr-local-ci-fix.patch"
          git apply "$RUNNER_TEMP/reviewed-pr-local-ci-fix.patch"
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('docs/local-ci-and-safe-runners.md',
               '- `.github/workflows/atlasmind-reviewed-pr-local-ci.yml` -- an owner-only manual workflow whose inputs',
               '- **.github/workflows/atlasmind-reviewed-pr-local-ci.yml** -- an owner-only manual workflow whose inputs'),
              ('src/views/chatSlashRouting.ts',
               'so every one of the twenty\n * deterministic slash commands',
               'so every one of the twenty-seven\n * recognised slash commands'),
              ('src/views/chatSlashRouting.ts',
               'is twenty-two chances for the panel to',
               'is twenty-five chances for the panel to'),
              ('tests/chat/slashCommandRouting.test.ts',
               "    24: 'twenty-four', 25: 'twenty-five',\n",
               "    24: 'twenty-four', 25: 'twenty-five', 26: 'twenty-six', 27: 'twenty-seven',\n"),
              ('src/core/localCiRepositoryPatch.ts',
               'export function isAtlasMindManagedLocalCiContent(',
               'function isAtlasMindManagedLocalCiContent('),
              ('src/core/reviewedPrLocalCi.ts',
               'export function reviewedPrFingerprint(',
               'function reviewedPrFingerprint('),
          ]
          for filename, old, new in replacements:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected one repair target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/reviewed-pr-local-ci.patch.gz.b64.part-*
          rm .github/reviewed-pr-local-ci-fix.patch.gz.b64
          rm .github/reviewed-pr-local-ci.ready
          rm .github/workflows/one-shot-export-atlasmind-source.yml
          rm .github/workflows/one-shot-export-applied-source.yml
          git diff --check
          node --check media/projectDashboard.js

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "Joel Bondoux"
          git config user.email "email@joelbondoux.net"
          git add -A
          git -c core.hooksPath=/dev/null commit -m "feat: add provider-neutral reviewed-PR local CI"
          git push origin HEAD:refs/heads/feat/provider-neutral-reviewed-pr-local-ci
