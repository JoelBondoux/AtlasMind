name: AtlasMind reviewed PR local CI

# atlasmind:reviewed-pr-local-ci:v1
# Generated by AtlasMind. A person approves one immutable same-repository
# head SHA before this workflow is dispatched. The authoring tool is not a
# trust signal: Codex, Claude, another agent, and a human use the same path.
run-name: >-
  AtlasMind local CI PR #${{ inputs.pr_number }} @ ${{ inputs.pr_sha }}
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Reviewed PR number
        required: true
        type: string
      pr_sha:
        description: Exact reviewed head SHA
        required: true
        type: string
      head_repo:
        description: Exact same-repository slug
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlasmind-reviewed-pr-${{ inputs.pr_sha }}
  cancel-in-progress: false

jobs:
  reviewed-quality:
    name: Reviewed PR quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'JoelBondoux/AtlasMind' &&
      github.ref == 'refs/heads/develop' &&
      github.actor == github.repository_owner &&
      inputs.head_repo == github.repository
    runs-on: [atlasmind-reviewed-pr-x64]
    timeout-minutes: 60
    env:
      CI: true
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Check out the trusted controller
        # v7; immutable reviewed pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: atlasmind-controller
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the approved identity
        shell: bash
        env:
          APPROVED_PR_NUMBER: ${{ inputs.pr_number }}
          APPROVED_PR_SHA: ${{ inputs.pr_sha }}
          APPROVED_HEAD_REPO: ${{ inputs.head_repo }}
        run: |
          [[ "$APPROVED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_PR_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$APPROVED_HEAD_REPO" = "JoelBondoux/AtlasMind"

      - name: Check out the approved candidate
        # v7; immutable reviewed pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.pr_sha }}
          path: candidate
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js for the trusted controller
        # v7; immutable reviewed pin.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Run the trusted command contract against the approved SHA
        shell: bash
        run: >-
          node atlasmind-controller/.atlasmind/local-ci-runner.mjs
          atlasmind-controller/.atlasmind/local-ci.json
          candidate
