name: Release — promote develop to main

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — validate and create PR but skip auto-merge enablement"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release secrets
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::error::Missing RELEASE_TOKEN secret."
            exit 1
          fi

          # No Marketplace secret is required any more: publishing authenticates
          # through Microsoft Entra ID with workload identity federation. What the
          # publish job needs is the identity's coordinates, which are variables
          # rather than secrets because none of them is secret.
          for VAR_NAME in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            case "$VAR_NAME" in
              AZURE_CLIENT_ID) VALUE='${{ vars.AZURE_CLIENT_ID }}' ;;
              AZURE_TENANT_ID) VALUE='${{ vars.AZURE_TENANT_ID }}' ;;
              AZURE_SUBSCRIPTION_ID) VALUE='${{ vars.AZURE_SUBSCRIPTION_ID }}' ;;
            esac
            if [ -z "$VALUE" ]; then
              echo "::error::Missing repository variable ${VAR_NAME}."
              exit 1
            fi
          done

      - name: Create or find release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          EXISTING=$(gh pr list --base main --head develop --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Reusing existing PR #${EXISTING}"
            PR_NUMBER="$EXISTING"
          else
            BODY="Automated release promotion for v${VERSION}. See CHANGELOG.md for full release notes."
            PR_URL=$(gh pr create \
              --base main \
              --head develop \
              --title "chore: promote develop to main for ${VERSION}" \
              --body "$BODY")
            PR_NUMBER="${PR_URL##*/}"
            echo "Created PR #${PR_NUMBER}"
          fi

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Enable release PR auto-merge
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # A *merge commit*, not a squash.
          #
          # Squashing rewrites develop's commits into one new commit on main, so
          # main immediately holds a commit that is not an ancestor of develop.
          # The next promotion then has a merge base from two releases back, and
          # every file both branches touched since — CHANGELOG.md, package.json,
          # README.md, wiki/Changelog.md, i.e. exactly the four every release
          # touches — conflicts. It works once and conflicts forever after, which
          # is what happened between 0.208.0 and 0.208.1.
          #
          # A merge commit keeps main an ancestor of develop, so the next
          # promotion is a fast-forward-shaped merge with nothing to resolve.
          gh pr merge ${{ steps.pr.outputs.number }} \
            --auto \
            --merge

      - name: Write job summary
        if: always()
        run: |
          VERSION=${{ steps.pr.outputs.version }}
          PR=${{ steps.pr.outputs.number }}
          DRY="${{ inputs.dry_run }}"

          {
            echo "## Release summary"
            echo ""
            echo "| Field   | Value |"
            echo "|---------|-------|"
            echo "| Version | \`${VERSION}\` |"
            echo "| PR      | [#${PR}](https://github.com/${{ github.repository }}/pull/${PR}) |"
            if [ "$DRY" = "true" ]; then
              echo "| Mode    | Dry run — auto-merge not enabled |"
            else
              echo "| Mode    | Auto-merge enabled; publish will run after main is tagged |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
