# Are the bundled model prices still current?
#
# Every cost and saving AtlasMind reports is arithmetic against the price table
# in `src/providers/modelCatalog.ts`. There is no runtime network call and no
# service to run, which is the right design for a free extension — and it has
# one failure mode: the table goes stale and nothing says so.
#
# **This does not fetch prices.** Providers publish pricing as prose on marketing
# pages, with no stable machine-readable feed, so a scraper would break quietly
# and then report *wrong* prices — which is worse than stale ones, because a
# wrong number is stated with the same confidence as a right one. What this does
# is notice the table is old and ask a person to go and look.
#
# It opens at most one issue, and reuses it rather than filing a new one every
# month.
name: Model prices — freshness check

on:
  schedule:
    # Monthly. Prices move a few times a year; a weekly nag would be ignored.
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the catalog's verification date
        id: age
        shell: bash
        run: |
          set -euo pipefail
          verified=$(grep -oP "MODEL_CATALOG_VERIFIED_AT = '\K[0-9]{4}-[0-9]{2}-[0-9]{2}" \
            src/providers/modelCatalog.ts || true)
          threshold=$(grep -oP 'MODEL_CATALOG_STALE_AFTER_DAYS = \K[0-9]+' \
            src/providers/modelCatalog.ts || true)

          # An unreadable date is treated as stale, never as current — the same
          # rule the runtime reader applies. Failing quiet here would defeat the
          # whole check.
          if [ -z "$verified" ] || [ -z "$threshold" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "age=unknown" >> "$GITHUB_OUTPUT"
            echo "verified=unreadable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age=$(( ( $(date -u +%s) - $(date -u -d "$verified" +%s) ) / 86400 ))
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          echo "age=$age" >> "$GITHUB_OUTPUT"
          if [ "$age" -gt "$threshold" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the reminder
        if: steps.age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED: ${{ steps.age.outputs.verified }}
          AGE: ${{ steps.age.outputs.age }}
        shell: bash
        run: |
          set -euo pipefail
          title="Model prices need re-verifying"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number -q '.[0].number' || true)

          body=$(cat <<EOF
          The price table in \`src/providers/modelCatalog.ts\` was last verified on **$VERIFIED**, $AGE days ago.

          Every cost and saving AtlasMind reports is arithmetic against that table, and the producer report
          now states its age beside the figures — so until it is checked, those figures carry a visible
          "may be out of date" note.

          To close this:

          1. Check the published pricing pages for the providers in the catalog.
          2. Update any prices that moved.
          3. Bump \`MODEL_CATALOG_VERIFIED_AT\` to today — **only if you actually checked**. A date that moves
             without a check turns "these numbers are old" into "these numbers are current", which is the
             wrong direction to be wrong in.

          Opened automatically. No prices were fetched or changed by this workflow.
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label dependencies
          fi
